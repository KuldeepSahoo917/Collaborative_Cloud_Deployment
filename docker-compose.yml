version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/whiteboard.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/var/www/whiteboard/dist
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
